
[coverage:run]
branch = True
source = service
omit = */tests/*

[coverage:report]
show_missing = True

[flake8]
exclude = .git,venv,__pycache__
max-line-length = 100

[nosetests]
verbosity = 2
with-coverage = 1
cover-erase = 1
cover-package = service
cover-inclusive = 1
cover-html = 1
cover-xml = 1

[pylint]
disable = C0114,C0115,C0116
max-line-length = 100
